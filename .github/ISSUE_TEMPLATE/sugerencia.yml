name: Tengo una idea
description: Algo que te haría más cómodo usar Nexo
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría que hiciera Nexo?
      description: Cuéntalo como se te ocurra.
    validations:
      required: true
  - type: textarea
    id: para-que
    attributes:
      label: ¿Para qué lo usarías?
      description: Una situación real de tu semana (una clase, una tarea, un examen…) ayuda a entender la idea.
