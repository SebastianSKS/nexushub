name: Publicar

# Al crear una etiqueta de versión (v0.3.0, v0.3.1…): compila el instalador de Windows (.exe) y el de Linux (.deb y
# AppImage), firma los dos, arma el latest.json que necesita el autoactualizador y sube todo a un Release con el
# nombre de la etiqueta. Así una versión con Linux no necesita que alguien tenga a mano una máquina Linux: la
# compila GitHub.
#
# Para que funcione hacen falta dos secretos del repositorio (Settings › Secrets and variables › Actions):
#   - TAURI_SIGNING_PRIVATE_KEY: el contenido completo de src-tauri/nexushub-updater.key (el archivo, no su ruta).
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: su contraseña (puede quedar vacía si la llave no tiene).
# El número de versión sale de la propia etiqueta (v0.3.0 → 0.3.0): tiene que ser el mismo que ya está en
# tauri.conf.json/package.json/Cargo.toml antes de etiquetar, o la compilación produce archivos con otro nombre.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar y firmar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build
          # Una sola carpeta (no varios patrones sueltos): así upload-artifact no le recorta el camino común y el
          # contenido queda tal cual, listo para que download-artifact lo reponga en el mismo lugar más abajo.
          path: src-tauri/target/release/bundle/nsis
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux (.deb y AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependencias de Tauri en Linux
        env:
          # Sin esto, algún paquete de la cadena (p. ej. de libayatana-appindicator3-dev) puede pedir confirmación
          # por un prompt de debconf; sin terminal, apt se queda esperando una respuesta que nunca llega — no es
          # lento, está colgado. `timeout` es la red de seguridad: si aun así se cuelga, falla en 5 min, no en 25.
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 120 apt-get update
          sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar y firmar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy y appimagetool (los usa Tauri para armar el AppImage) son ellos mismos AppImages: sin esto
          # intentan montarse con FUSE, que no está en los runners de GitHub, y se quedan a medias (la carpeta
          # Nexo.AppDir sin empaquetar) sin que la compilación avise con un error.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-build
          # La carpeta que contiene deb/ y appimage/, no cada una por separado: con un solo camino común
          # (src-tauri/target/release/bundle), download-artifact la repone tal cual más abajo.
          path: src-tauri/target/release/bundle
          retention-days: 1
          if-no-files-found: error

  publicar:
    name: Publicar el Release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # De vuelta a su ruta exacta (la misma carpeta que se subió), que es donde generar-latest-json.mjs y
      # verificar-release.mjs ya saben buscarlas.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-build
          path: src-tauri/target/release/bundle/nsis
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle
      - name: Qué nsis quedó (diagnóstico, se puede quitar luego)
        run: |
          detalle=$( (ls -la src-tauri/target/release/bundle/nsis/ 2>&1) | tr '\n' ';' || true)
          echo "::warning::NSIS: $detalle"
      - name: Qué AppImage quedó (diagnóstico, se puede quitar luego)
        run: |
          detalle=$( (ls -la src-tauri/target/release/bundle/appimage/*.AppImage* 2>&1) | tr '\n' ';' || true)
          echo "::warning::APPIMAGE: $detalle"
      - name: Generar latest.json
        run: |
          firma_linux=$(ls src-tauri/target/release/bundle/appimage/*.AppImage.sig)
          node scripts/generar-latest-json.mjs "Nexo ${GITHUB_REF_NAME#v}" --linux-sig "$firma_linux"
      - name: Revisar que lo compilado esté completo antes de publicarlo
        run: node scripts/verificar-release.mjs
      - name: Publicar el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nexo ${GITHUB_REF_NAME#v}" \
            --notes "Nexo ${GITHUB_REF_NAME#v}. Novedades: https://github.com/${GITHUB_REPOSITORY}/blob/main/src/lib/novedades.ts" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.exe.sig \
            src-tauri/target/release/bundle/nsis/latest.json \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
