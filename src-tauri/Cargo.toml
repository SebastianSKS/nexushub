[package]
name = "nexushub"
version = "0.1.2"
description = "Video, música, documentos y calendario en una sola ventana, con el lenguaje de diseño Fluent de Windows 11."
authors = ["Sebastián"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "=2.6.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
# Servidor local mínimo: solo atrapa el regreso de Spotify tras iniciar sesión (ver captura_spotify.rs).
tiny_http = "0.12"

[profile.release]
# "thin" da casi el mismo tamaño/velocidad que "fat" pero compila muchísimo más rápido.
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
