<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="fondo" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2fa4ff"/>
      <stop offset="0.55" stop-color="#0f6cbd"/>
      <stop offset="1" stop-color="#0a3f86"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee0ff"/>
      <stop offset="1" stop-color="#3aa7ff"/>
    </linearGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#04204f" flood-opacity="0.45"/>
    </filter>
    <filter id="sombraSuave" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#04204f" flood-opacity="0.3"/>
    </filter>
    <clipPath id="marco"><rect x="32" y="32" width="960" height="960" rx="224"/></clipPath>
  </defs>

  <!-- Base: cuadrado redondeado, degradado azul Fluent -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#fondo)"/>
  <g clip-path="url(#marco)">
    <!-- luz suave arriba, como los iconos de Office -->
    <rect x="32" y="32" width="960" height="520" fill="url(#brillo)"/>
    <!-- ola translúcida abajo -->
    <path d="M32 700 C 260 600 470 790 700 690 C 820 640 920 650 992 680 L 992 992 L 32 992 Z" fill="#ffffff" opacity="0.09"/>
  </g>

  <!-- Hoja de atrás (capa desplazada, da profundidad) -->
  <rect x="300" y="196" width="470" height="560" rx="96" fill="url(#hoja)" opacity="0.75" filter="url(#sombraSuave)" transform="rotate(8 535 476)"/>

  <!-- Hoja principal -->
  <rect x="226" y="236" width="500" height="580" rx="104" fill="#ffffff" opacity="0.14" transform="rotate(-5 476 526)"/>

  <!-- Letra N: dos barras y una diagonal -->
  <g filter="url(#sombra)">
    <path fill="url(#letra)" d="M268 764 V262 H396 L628 570 V262 H756 V764 H628 L396 456 V764 Z"/>
  </g>

  <!-- Nodo (el «nexo») -->
  <circle cx="772" cy="252" r="58" fill="#ffd23f" filter="url(#sombraSuave)"/>
  <circle cx="772" cy="252" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="8"/>
</svg>
